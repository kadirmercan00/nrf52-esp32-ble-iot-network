; PlatformIO Project Configuration File for Nordic nRF52840 Node
; Kadir Mercan (Mercan Studio)

[platformio]
default_envs = adafruit_feather_nrf52840

[env:adafruit_feather_nrf52840]
platform = nordicnrf52
board = adafruit_feather_nrf52840
framework = arduino

monitor_speed = 115200

build_flags = 
    -D NRF52840_XXAA
    -I include

lib_deps =
    adafruit/Adafruit BluefruitLE nRF52 @ ^0.21.0
    adafruit/Adafruit LittleFS @ ^0.11.0
