; PlatformIO Project Configuration File for Nordic nRF52840 Node
; Kadir Mercan (Mercan Studio)

[platformio]
default_envs = xiaoblesense

[env:xiaoblesense]
platform = nordicnrf52 @ 9.5.0
board = xiaoblesense
framework = arduino

monitor_speed = 115200

build_flags = 
    -D NRF52840_XXAA
    -I include

lib_deps =
    adafruit/Adafruit BluefruitLE nRF52 @ ^0.21.0
    adafruit/Adafruit LittleFS @ ^0.11.0
