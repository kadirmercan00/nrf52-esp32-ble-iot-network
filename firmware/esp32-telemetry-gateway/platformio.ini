; PlatformIO Project Configuration File for ESP32 Edge Gateway
; Kadir Mercan (Mercan Studio)

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32 @ 6.5.0
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 921600

build_flags = 
    -D CORE_DEBUG_LEVEL=3
    -I include

lib_deps =
    h2zero/NimBLE-Arduino @ ^1.4.1
    bblanchon/ArduinoJson @ ^6.21.4
    knolleary/PubSubClient @ ^2.8
